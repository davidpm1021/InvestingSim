<h2 mat-dialog-title>{{ dialogTitle }}</h2>
<mat-dialog-content>
  <p>Current {{ accountType }} Balance: ${{ data.maxAmount | number:'1.2-2' }}</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ data.transferDirection === 'to-brokerage' ? 'Amount to Add' : 'Amount to Withdraw' }}</mat-label>
    <input matInput 
           type="number" 
           [(ngModel)]="transferAmount" 
           [max]="data.maxAmount"
           min="0.01"
           step="0.01"
           [placeholder]="data.transferDirection === 'to-brokerage' ? 'Enter amount to add' : 'Enter amount to withdraw'">
    <mat-hint>Maximum: ${{ data.maxAmount | number:'1.2-2' }}</mat-hint>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button 
          color="primary" 
          [disabled]="!isValidAmount()"
          (click)="onTransfer()">
    {{ data.transferDirection === 'to-brokerage' ? 'Add Funds' : 'Withdraw Funds' }}
  </button>
</mat-dialog-actions>
