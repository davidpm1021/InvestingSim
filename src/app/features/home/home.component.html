<div class="home-container">
  <div class="welcome-section" *ngIf="guideContent">
    <h1>{{ guideContent.heading }}</h1>
  </div>

  <div class="instructions-section" *ngIf="guideContent">
    <div class="instruction-card" *ngFor="let section of guideContent.sections">
      <h2>{{ section.h2 }}</h2>
      <p *ngFor="let paragraph of section.paragraphs">{{ paragraph }}</p>
    </div>
  </div>
</div>
