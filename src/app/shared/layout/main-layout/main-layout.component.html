<!-- Default Layout -->
<div class="main-layout" *ngIf="currentLayout === 'default'">
  <app-header></app-header>
  <div class="layout-body">
    <app-sidebar></app-sidebar>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Web Browser Layout -->
<div class="browser-layout" *ngIf="currentLayout === 'web_browser'">
  <app-header></app-header>
  <div class="browser-window" 
       [class.maximized]="isMaximized" 
       [class.minimized]="isMinimized"
       [class.closing]="isClosing"
       (click)="isMinimized ? restoreFromMinimized() : null">
    <!-- Browser Tabs -->
    <div class="browser-tabs">
      <div class="tab tab-home" 
           [class.active]="currentRoute === '/home'"
           (click)="navigateTo('/home'); $event.stopPropagation()">
        <mat-icon class="tab-favicon">school</mat-icon>
        <span class="tab-text">Investing Sim</span>
      </div>
      <div class="tab tab-banking" 
           [class.active]="currentRoute === '/banking'"
           (click)="navigateTo('/banking'); $event.stopPropagation()">
        <mat-icon class="tab-favicon">account_balance</mat-icon>
        <span class="tab-text">My Bank</span>
      </div>
      <div class="tab tab-investing" 
           [class.active]="currentRoute === '/investing'"
           (click)="navigateTo('/investing'); $event.stopPropagation()">
        <mat-icon class="tab-favicon">trending_up</mat-icon>
        <span class="tab-text">My Investing</span>
      </div>
      <div class="tab tab-admin" 
           [class.active]="currentRoute === '/admin'"
           [class.hidden]="!hasAccessedAdmin"
           (click)="navigateTo('/admin'); $event.stopPropagation()">
        <mat-icon class="tab-favicon">settings</mat-icon>
        <span class="tab-text">Admin Panel</span>
      </div>
      <div class="tab tab-bank-sim" 
           [class.active]="currentRoute === '/bank-sim'"
           [class.hidden]="!hasAccessedBankSim"
           (click)="navigateTo('/bank-sim'); $event.stopPropagation()">
        <mat-icon class="tab-favicon">account_balance</mat-icon>
        <span class="tab-text">Bank Sim</span>
      </div>
      
      <!-- Browser Window Controls -->
      <div class="browser-controls">
        <button class="control-btn minimize-btn" (click)="minimizeWindow(); $event.stopPropagation()" title="Minimize">
          <mat-icon>remove</mat-icon>
        </button>
        <button class="control-btn restore-btn" 
                *ngIf="isMaximized" 
                (click)="restoreWindow(); $event.stopPropagation()" 
                title="Restore">
          <mat-icon>fullscreen_exit</mat-icon>
        </button>
        <button class="control-btn maximize-btn" 
                *ngIf="!isMaximized" 
                (click)="maximizeWindow(); $event.stopPropagation()" 
                title="Maximize">
          <mat-icon>fullscreen</mat-icon>
        </button>
        <button class="control-btn close-btn" (click)="closeWindow(); $event.stopPropagation()" title="Close">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Browser Navigation Bar -->
    <div class="browser-nav">
      <div class="nav-buttons">
        <button class="nav-btn" (click)="goBack()" title="Back">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <button class="nav-btn" (click)="goForward()" title="Forward">
          <mat-icon>arrow_forward</mat-icon>
        </button>
        <button class="nav-btn" (click)="refresh()" title="Refresh">
          <mat-icon>refresh</mat-icon>
        </button>
        <button class="nav-btn" (click)="goHome()" title="Home">
          <mat-icon>home</mat-icon>
        </button>
      </div>
      
      <div class="address-bar">
        <span class="security-icon" *ngIf="isSecureUrl()">🔒</span>
        <span class="address-text">{{ getCurrentUrl() }}</span>
        <span class="loading-indicator" *ngIf="isLoading">⟳</span>
      </div>
    </div>

    <!-- Browser Content -->
    <div class="browser-content" [class.loading]="isLoading">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
