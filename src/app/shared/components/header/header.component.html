<header class="header">
  <div class="header-content">
    <div class="logo">
      <img src="images/logo.svg" alt="Investing Sim" class="logo-image">
    </div>
            <div class="header-controls">
              <div class="quarter-info">
                <span class="current-quarter-label">Current: {{ currentQuarterLabel }}</span>
              </div>
              <button *ngIf="canNavigateToNext"
                      mat-raised-button
                      color="primary"
                      class="jump-quarter-button"
                      [disabled]="quarterJumpDisabled"
                      (click)="onJumpToNextQuarter()">
                <mat-icon fontIcon="la-arrow-right"></mat-icon>
                Jump to {{ nextQuarterLabel }}
              </button>
              <button *ngIf="atYearEnd"
                      mat-raised-button
                      color="primary"
                      class="capstone-button"
                      (click)="openCapstone()">
                <mat-icon fontIcon="la-trophy"></mat-icon>
                Open Review
              </button>
              <button mat-raised-button color="warn" class="reset-button" (click)="onReset()">
                <mat-icon fontIcon="la-sync"></mat-icon>
                Reset
              </button>
              <button mat-icon-button class="notif-button" [matMenuTriggerFor]="notifMenu" (menuOpened)="onNotificationsOpened()" aria-label="Notifications">
                <mat-icon [matBadge]="unreadCount" [matBadgeHidden]="unreadCount === 0" matBadgeColor="warn" matBadgeSize="small" fontIcon="la-bell"></mat-icon>
              </button>
              <mat-menu #notifMenu="matMenu" class="notif-menu" xPosition="before">
                <div class="notif-header">Notifications</div>
                <div class="notif-empty" *ngIf="notifications.length === 0">You're all caught up.</div>
                <button mat-menu-item class="notif-item" *ngFor="let n of notifications" (click)="onNotificationClick(n)">
                  <span class="notif-msg">{{ n.message }}</span>
                  <span class="notif-date" *ngIf="n.date">{{ n.date | evergreenDate:'short' }}</span>
                </button>
              </mat-menu>
              <button *ngIf="showDevControls" mat-raised-button color="primary" class="account-button" [matMenuTriggerFor]="accountMenu">
                <mat-icon fontIcon="la-user-circle"></mat-icon>
                Account
              </button>
              <mat-menu #accountMenu="matMenu">
                <button mat-menu-item (click)="goToAdmin()">
                  <mat-icon fontIcon="la-cog"></mat-icon>
                  <span>Admin Panel</span>
                </button>
              </mat-menu>
            </div>
  </div>
</header>
