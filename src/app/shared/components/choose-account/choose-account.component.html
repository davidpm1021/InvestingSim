<div fxLayout="column" class="choose-container">
  <h3>SELECT ACCOUNT</h3>
 <div fxLayout="row" fxLayout.sm="column" fxLayout.xs="column" fxLayoutGap="10px">
  <div fxFlex="50%" fxLayoutGap="10px">
    <button mat-button [ngClass]='{"active": accountType === "2"}' (click)="radioChange('2')">Checking</button>
    <button mat-button [ngClass]='{"active": accountType === "1"}' (click)="radioChange('1')">Saving</button>
  </div>
  <div fxFlex="50%" fxLayoutAlign="end start">
    <form [formGroup]="searchForm" class="search-form" *ngIf="isSearch">
      <mat-form-field appearance="outline">
        <input matInput placeholder="Search" formControlName="search" (keyup)="filterTable($event)" />
        <mat-icon matSuffix *ngIf="!search?.value">search</mat-icon>
        <mat-icon matSuffix *ngIf="search?.value" (click)="clearSearch()" class="close">close</mat-icon>
      </mat-form-field>
    </form>
  </div>
 </div>
</div>
