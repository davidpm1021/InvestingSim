<div fxLayout="column" class="padding-24">
  <div mat-dialog-content fxLayout="row" fxLayoutAlign="start center" style="height: 490px">
      <div style="height: 95%; width: 100%">
          <iframe *ngIf="pdfUrl" [src]="pdfUrl" width="100%" height="1200px" frameborder="0"></iframe>
      </div>
  </div>
  <div fxLayout="row" fxLayoutAlign="end" fxLayoutGap="10px" class="padding-5">
      <button class='button' mat-raised-button mat-dialog-close color="primary">OK</button>
  </div>
</div>
