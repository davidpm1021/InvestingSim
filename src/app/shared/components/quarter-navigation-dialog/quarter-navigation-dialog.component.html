<div class="quarter-navigation-dialog">
  <h2 mat-dialog-title>Move to {{ data.nextQuarterLabel }}?</h2>

  <mat-dialog-content>
    <p class="confirmation-message">
      Three months of price changes happen at once.
    </p>
    <p class="warning-message">
      <mat-icon fontIcon="la-exclamation-triangle"></mat-icon>
      Make any trades you want first. You cannot come back to an earlier quarter.
    </p>
  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" class="cancel-button">
      Cancel
    </button>
    <button mat-raised-button 
            color="primary" 
            (click)="onConfirm()" 
            class="confirm-button">
      Continue to {{ data.nextQuarterLabel }}
    </button>
  </mat-dialog-actions>
</div>
