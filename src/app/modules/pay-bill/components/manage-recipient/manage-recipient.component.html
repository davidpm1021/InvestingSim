<div class="main-container">
  <mat-card class="card">
    <mat-card-content>
      <div class="heading">
        <h1>Recipients</h1>
      </div>
      <div fxLayout="column" fxLayoutGap="30px">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="15px">
          <div fxFlex="100%">
            <div class="add-button" fxLayoutAlign="start center" (click)="openRecipientDialog()">
              <mat-icon>add</mat-icon>
             <span>ADD RECIPIENT</span>
            </div>
          </div>
        </div>
        <div fxLayout="row">
          <div fxFlex="100%">
            <h3>EXISTING RECIPIENT</h3>
          </div>
        </div>
        <div fxLayout="row">
          <div fxFlex="100%">
              <table mat-table class="table-container" [dataSource]="tableDataSource" matSort>
          
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Name </th>
                  <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>
    
                <ng-container matColumnDef="edit">
                  <th mat-header-cell *matHeaderCellDef>  </th>
                  <td mat-cell *matCellDef="let element"><a (click)="edit(element)">Edit</a> </td>
                </ng-container>
    
                <ng-container matColumnDef="delete">
                  <th mat-header-cell *matHeaderCellDef>  </th>
                  <td mat-cell *matCellDef="let element"> <a (click)='delete(element)'>Delete</a> </td>
                </ng-container>
          
                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header"></tr>
                <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns" class="cursor-pointer">
                </tr>
              </table>
          
              <!-- Paginator for table -->
              <div class="page-footer">
                <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons></mat-paginator>
              </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
