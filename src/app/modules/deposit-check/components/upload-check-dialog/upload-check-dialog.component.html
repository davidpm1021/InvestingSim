<div fxLayout="row">
  <div fxFlex="95%">
    <h2 *ngIf="data.check === 'front'">FRONT SIDE OF THE CHECK</h2>
    <h2 *ngIf="data.check === 'back'">BACK SIDE OF THE CHECK</h2>
  </div>
  <div fxFlex="5%">
    <mat-icon class="icon" [mat-dialog-close]>close</mat-icon>
  </div>
</div>
<div mat-dialog-content>
  <img src="assets/images/cheque_front1.jpg" *ngIf="data.check === 'front'" alt="">
  <img src="assets/images/cheque_back1.jpg" *ngIf="data.check === 'back'">
</div>
