<div fxLayout='row' fxLayoutAlign='space-between center'>
  <div>
    <h2>
      Account Number
    </h2>
    <mat-list role="list">
      <mat-list-item role="listitem" *ngFor='let account of accountNumbers'>#{{account}}</mat-list-item>
    </mat-list>
  </div>
  <div>
    <h2>
      Routing Number
    </h2>
    <mat-list role="list">
      <mat-list-item role="listitem" *ngFor='let account of routingNumbers'>#{{account}}</mat-list-item>
    </mat-list>
  </div>
</div>
