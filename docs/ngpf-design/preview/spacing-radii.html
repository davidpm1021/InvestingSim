<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="meta">RADII</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;">
    <div style="text-align:center;">
      <div style="height:80px; background:#dfe9ff; border-radius:5px; margin-bottom:8px;"></div>
      <div class="label" style="font-size:12px;">5</div><div class="mono">--radius-sm · cards</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px; background:#dfe9ff; border-radius:8px; margin-bottom:8px;"></div>
      <div class="label" style="font-size:12px;">8</div><div class="mono">--radius-md · tiny btn</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px; background:#dfe9ff; border-radius:10px; margin-bottom:8px;"></div>
      <div class="label" style="font-size:12px;">10</div><div class="mono">--radius-lg · buttons</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px; background:#dfe9ff; border-radius:16px; margin-bottom:8px;"></div>
      <div class="label" style="font-size:12px;">16–20</div><div class="mono">illustration cards</div>
    </div>
    <div style="text-align:center;">
      <div style="height:80px; background:#dfe9ff; border-radius:999px; margin-bottom:8px;"></div>
      <div class="label" style="font-size:12px;">pill</div><div class="mono">badges</div>
    </div>
  </div>
  <div style="background:#f3f0f0; padding:10px 14px; border-radius:8px;">
    <div class="mono" style="color:var(--ngpf-dark-blue); font-size:11px; line-height:1.5;">Rule: never put a full border on a rounded-corner box. If you want a border, restrict it to one side (top OR left) and match the radius to those corners only.</div>
  </div>
</div></body></html>
