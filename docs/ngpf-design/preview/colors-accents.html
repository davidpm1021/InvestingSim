<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="meta">ACCENTS — DECORATIVE & WARM CTA</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;">
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#1db8e8; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label">Sky</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">Illustrations</div>
        <div class="mono">#1db8e8</div>
        <div class="mono" style="color:#858585;">--ngpf-light-blue</div>
      </div>
    </div>
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#f4ad00; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label" style="color:#0b1541;">Gold</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">Math nav · highlights</div>
        <div class="mono">#f4ad00</div>
        <div class="mono" style="color:#858585;">--ngpf-gold</div>
      </div>
    </div>
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#f78219; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label">Orange</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">Account · accent</div>
        <div class="mono">#f78219</div>
        <div class="mono" style="color:#858585;">--ngpf-orange</div>
      </div>
    </div>
  </div>
  <div style="font-family:var(--font-sans); font-size:12px; color:#858585; line-height:1.4;">⚠ Avoid gold on <code>#1f3b9b</code> / <code>#275ce4</code>. Gold on <code>#0b1541</code> is OK.</div>
</div></body></html>
