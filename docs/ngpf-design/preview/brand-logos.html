<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="meta">LOGOS</div>
  <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:14px;">
    <!-- PRIMARY: Horizontal Color -->
    <div style="background:#fff; border:1px solid #e7ebee; border-radius:8px; padding:36px 22px 18px; display:flex; flex-direction:column; align-items:center; gap:18px;">
      <img src="../assets/ngpf-horizontal-primary.png" alt="NGPF horizontal primary" style="width:260px; height:auto;">
      <div style="text-align:center;">
        <div class="label" style="font-size:13px;">Horizontal · Primary</div>
        <div class="mono" style="color:#858585; margin-top:2px;">first page · footer · web nav</div>
      </div>
    </div>
    <!-- SECONDARY: Vertical Color -->
    <div style="background:#fff; border:1px solid #e7ebee; border-radius:8px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px;">
      <img src="../assets/ngpf-vertical-secondary.png" alt="NGPF vertical secondary" style="height:150px; width:auto;">
      <div style="text-align:center;">
        <div class="label" style="font-size:13px;">Vertical · Secondary</div>
        <div class="mono" style="color:#858585; margin-top:2px;">stamps · square crops · profile</div>
      </div>
    </div>
  </div>

  <!-- KO variants — smaller, supporting examples -->
  <div class="meta" style="margin-top:4px;">KNOCK-OUT (WHITE) VARIANTS</div>
  <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:14px;">
    <div style="background:#1f3b9b; border-radius:8px; padding:24px 22px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/ngpf-horizontal-primary-ko.png" alt="NGPF horizontal KO" style="width:200px; height:auto;">
    </div>
    <div style="background:#0b1541; border-radius:8px; padding:18px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/ngpf-vertical-secondary-ko.png" alt="NGPF vertical KO" style="height:110px; width:auto;">
    </div>
  </div>
  <div class="mono" style="color:#858585;">KO variants only on brand-blue / midnight surfaces. On photography, place the color primary on a white plate.</div>
</div></body></html>
