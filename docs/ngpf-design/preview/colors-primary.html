<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="meta">PRIMARY BLUES</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;">
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#1f3b9b; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label">True Blue</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">Primary</div>
        <div class="mono">#1f3b9b · rgb(31,59,155)</div>
        <div class="mono" style="color:#858585;">--ngpf-primary-blue</div>
      </div>
    </div>
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#275ce4; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label">Bright Blue</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">CTA / Link</div>
        <div class="mono">#275ce4 · rgb(39,92,228)</div>
        <div class="mono" style="color:#858585;">--ngpf-bright-blue</div>
      </div>
    </div>
    <div style="border-radius:8px; overflow:hidden; box-shadow: var(--shadow-sm);">
      <div style="background:#0b1541; height:120px; display:flex; align-items:flex-end; padding:12px;"><span class="cap-label">Midnight</span></div>
      <div style="padding:10px 12px; background:#fff;">
        <div class="label">Body text / dark bg</div>
        <div class="mono">#0b1541 · rgb(11,21,65)</div>
        <div class="mono" style="color:#858585;">--ngpf-dark-blue</div>
      </div>
    </div>
  </div>
</div></body></html>
