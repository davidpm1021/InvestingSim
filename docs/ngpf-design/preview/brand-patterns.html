<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="meta">BRAND PATTERNS · TILES @ 600PX</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
    <div style="border-radius:8px; overflow:hidden; box-shadow:var(--shadow-sm);">
      <div style="background: url('../assets/pattern-primary-blue.png') center/300px repeat, #1f3b9b; height:170px; display:flex; align-items:flex-end; padding:14px;">
        <div style="color:#fff; font-family:var(--font-sans); font-weight:700; font-size:14px;">Primary Blue Pattern</div>
      </div>
      <div style="padding:8px 12px; background:#fff;">
        <div class="mono">--ngpf-bg-pattern-primary</div>
        <div class="mono" style="color:#858585;">deck covers · hero strips</div>
      </div>
    </div>
    <div style="border-radius:8px; overflow:hidden; box-shadow:var(--shadow-sm);">
      <div style="background: url('../assets/pattern-bright-blue.png') center/300px repeat, #275ce4; height:170px; display:flex; align-items:flex-end; padding:14px;">
        <div style="color:#fff; font-family:var(--font-sans); font-weight:700; font-size:14px;">Bright Blue Pattern</div>
      </div>
      <div style="padding:8px 12px; background:#fff;">
        <div class="mono">--ngpf-bg-pattern-bright</div>
        <div class="mono" style="color:#858585;">CTA panels · big stats</div>
      </div>
    </div>
  </div>
</div></body></html>
