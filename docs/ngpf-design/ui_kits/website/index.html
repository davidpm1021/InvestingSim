<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NGPF · Website UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <style>
    html, body { margin: 0; background: #fff; }
    body { font-family: var(--font-sans); color: var(--ngpf-ink); }
    * { box-sizing: border-box; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Illustrations.jsx"></script>
  <script type="text/babel" src="NavBar.jsx"></script>
  <script type="text/babel" src="HeroSection.jsx"></script>
  <script type="text/babel" src="IllustrationCardGrid.jsx"></script>
  <script type="text/babel" src="ContentCardGrid.jsx"></script>
  <script type="text/babel" src="BigNumbers.jsx"></script>
  <script type="text/babel" src="QuoteBlock.jsx"></script>
  <script type="text/babel" src="BlogStrip.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const App = () => {
      return (
        <div data-screen-label="01 NGPF Homepage">
          <NavBar active="Curriculum" />
          <HeroSection />

          <IllustrationCardGrid items={[
            { src: "../../assets/illustrations/unit-budgeting.png",        title: "Budgeting",       body: "Plan, track, and live within means" },
            { src: "../../assets/illustrations/unit-saving.png",           title: "Saving",          body: "Build the habit early" },
            { src: "../../assets/illustrations/unit-investing.png",        title: "Investing",       body: "Time in the market beats timing" },
            { src: "../../assets/illustrations/unit-paying-for-college.png", title: "Paying for College", body: "FAFSA, loans, and smart choices" },
            { src: "../../assets/illustrations/unit-career.png",           title: "Career",          body: "Job search, resumes, networking" },
          ]} />

          <BigNumbers items={[
            { value: "100k+", label: "teachers in classrooms today" },
            { value: "5M+",   label: "students reached every year" },
            { value: "50",    label: "states using NGPF curriculum" },
          ]} />

          <ContentCardGrid
            title="What's New This Week"
            sub="Fresh resources, picked by the NGPF team."
            items={[
              { badge: "Curriculum", title: "Hacks for the student activity packet", body: "Learn how to efficiently navigate the NGPF website to find resources for your classroom.", cta: "Read the post" },
              { badge: "Question of the Day", title: "What percent of Gen Zers don't have a monthly budget?", body: "A quick warm-up your students can finish in five minutes flat.", cta: "Open QoD" },
              { badge: "Webinar", title: "Investing 101: Teaching the basics", body: "Live PD with the NGPF team. Tuesday 7 PM ET — bring your questions.", cta: "Register" },
              { badge: "Toolkit", title: "FinLit Month classroom kit", body: "Posters, raffles, and a daily decision diary — everything you need to celebrate.", cta: "Download" },
            ]}
          />

          <QuoteBlock
            quote="NGPF gives my students the financial confidence they need to thrive after high school — and gives me back my weekends."
            speaker="Mia Park"
            school="Lincoln HS, Portland OR"
          />

          <BlogStrip posts={[
            { category: "Curriculum",  tagline: "Activity Idea", tint: "#275ce4", tint2: "#1f3b9b",
              title: "5 quick activities to teach compound interest in any unit" },
            { category: "Mission 2030", tagline: "Advocacy",     tint: "#1db8e8", tint2: "#275ce4",
              title: "Three states just passed personal-finance graduation requirements" },
            { category: "Teacher PD",   tagline: "Career Story", tint: "#f78219", tint2: "#f4ad00",
              title: "How Diana flipped her classroom in 30 days using NGPF resources" },
          ]} />

          <Footer />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
