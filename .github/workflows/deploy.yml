name: Deploy to GitHub Pages

# Builds the Angular app and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No built files are committed to the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pages serves this project at /InvestingSim/, so the app must be built
      # with that base-href or every asset and route would 404.
      - run: npm run build -- --base-href /InvestingSim/

      # The app uses client-side routing and does not prerender routes, so a
      # refresh on a deep link (e.g. /InvestingSim/investing) would 404. Serving
      # index.html for unknown paths lets Angular's router take over.
      - name: SPA fallback for client-side routes
        run: cp dist/investing-sim/browser/index.html dist/investing-sim/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/investing-sim/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
